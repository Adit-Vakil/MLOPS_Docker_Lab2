<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wine Cultivar Classifier</title>
  <style>
    body {
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: system-ui, sans-serif;
      color: #242424;
    }
    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    label { display: flex; flex-direction: column; gap: 6px; }
    input, button { padding: 10px; font: inherit; }
    button { grid-column: 1 / -1; cursor: pointer; }
    #result { padding: 16px 0; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Wine Cultivar Classifier</h1>
  <p>
    Enter the 13 chemical measurements used by the Wine dataset.
    The prediction identifies one of three cultivar classes.
  </p>

  <form id="prediction-form" action="/predict" method="post">
    {% for feature in feature_names %}
    <label>
      {{ feature | replace('_', ' ') | capitalize }}
      <input
        name="{{ feature }}"
        type="number"
        step="any"
        min="0"
        required
      >
    </label>
    {% endfor %}
    <button type="submit">Predict cultivar</button>
  </form>

  <p id="result" role="status" aria-live="polite"></p>

  <script>
    const form = document.getElementById("prediction-form");
    const result = document.getElementById("result");
    const button = form.querySelector("button");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      result.textContent = "Predicting…";
      button.disabled = true;

      try {
        const response = await fetch(form.action, {
          method: "POST",
          body: new FormData(form)
        });
        const data = await response.json();

        if (!response.ok) {
          result.textContent = data.error || "Prediction failed.";
          return;
        }
        result.textContent = `Predicted cultivar: ${data.predicted_class}`;
      } catch (error) {
        result.textContent = "Could not reach the server. Please try again.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
