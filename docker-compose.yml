services:
  model-training:
    build: &lab_build
      context: .
      dockerfile: dockerfile
      target: base
    working_dir: /exchange
    volumes:
      - ./src:/app/src:ro
      - model_exchange:/exchange
    command: ["python", "/app/src/model_training.py"]

  serving:
    build: *lab_build
    working_dir: /exchange
    volumes:
      - ./src:/app/src:ro
      - model_exchange:/exchange:ro
    depends_on:
      model-training:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:4000:4000"
    command: ["python", "/app/src/main.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:4000/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3

volumes:
  model_exchange:
